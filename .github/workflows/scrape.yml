name: 自动抓取

on:
  schedule:
    - cron: '0 */4 * * *'   # 每 4 小时抓一次 (UTC 时间)
  workflow_dispatch: {}      # 支持手动触发

permissions:
  contents: write            # 允许提交抓取数据回仓库

concurrency:
  group: scrape
  cancel-in-progress: false  # 上一次没跑完就排队, 不打断

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 Playwright + Chromium
        working-directory: scraper
        run: |
          npm install --no-fund --no-audit
          npx playwright install --with-deps chromium

      - name: 运行抓取
        working-directory: scraper
        run: node scrape-auto.js

      - name: 提交并推送数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "本次无新数据, 跳过提交"
          else
            git commit -m "auto: 更新视频存档 ($(date -u '+%Y-%m-%d %H:%M') UTC)"
            git push
          fi

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 打包站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
